<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>I dag – tidslinje</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A9CEFF}a:hover{color:#D4E7FF}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 36px 56px; background: #0F1317; color: #EEF1F4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: baseline; gap: 16px">
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.01em">I dag</h1>
      <span style="font-size: 20px; color: #A3ADB8">onsdag 11. november</span>
    </div>
    <div style="display: flex; gap: 12px; font-size: 15px; color: #A3ADB8">
      <span style="padding: 6px 12px; border: 1px solid #34404C; border-radius: 8px">‹ I går</span>
      <span style="padding: 6px 12px; border: 1px solid #34404C; border-radius: 8px">OK = detaljer</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
    <div style="background: #182028; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #A3ADB8"><span style="width: 10px; height: 10px; border-radius: 5px; background: #4E95F0"></span>Sett på</div>
      <div style="font-size: 32px; font-weight: 700">1 t 35 min</div>
      <div style="font-size: 15px; color: #A3ADB8">Netflix 1 t 15 · YouTube 20 min</div>
    </div>
    <div style="background: #182028; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #A3ADB8"><span style="width: 10px; height: 10px; border-radius: 5px; background: #6B7682"></span>Sto bare på</div>
      <div style="font-size: 32px; font-weight: 700">1 t 50 min</div>
      <div style="font-size: 15px; color: #A3ADB8">Skjermsparer, ingen aktivitet</div>
    </div>
    <div style="background: #182028; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #A3ADB8">Første gang slått på</div>
      <div style="font-size: 32px; font-weight: 700">14:08</div>
      <div style="font-size: 15px; color: #A3ADB8">Klokka er nå 17:52</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="position: relative; height: 26px; background: #182028; border-radius: 6px; overflow: hidden">
      <sc-for list="{{segs}}" as="seg" hint-placeholder-count="6">
        <div style="{{seg.style}}"></div>
      </sc-for>
      <div style="{{nowStyle}}"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3ADB8; font-variant-numeric: tabular-nums">
      <span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
      <div style="{{row.rowStyle}}">
        <span style="width: 150px; font-size: 18px; color: #C9D1D9; font-variant-numeric: tabular-nums">{{row.time}}</span>
        <span style="{{row.dotStyle}}"></span>
        <span style="width: 190px; font-size: 19px; font-weight: 600">{{row.app}}</span>
        <span style="{{row.chipStyle}}">{{row.label}}</span>
        <span style="margin-left: auto; font-size: 18px; color: #C9D1D9; font-variant-numeric: tabular-nums">{{row.dur}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var C = {
      play:  { bar: '#4E95F0', bg: 'rgba(78,149,240,0.18)', fg: '#A9CEFF', border: 'transparent', label: 'Sett på' },
      open:  { bar: '#F7C266', bg: 'rgba(247,194,102,0.15)', fg: '#F7C266', border: 'transparent', label: 'App åpen, ingenting spilt' },
      pause: { bar: '#F7C266', bg: 'rgba(247,194,102,0.15)', fg: '#F7C266', border: 'transparent', label: 'App åpen, pauset' },
      idle:  { bar: '#56616C', bg: 'rgba(160,170,180,0.14)', fg: '#C9D1D9', border: 'transparent', label: 'Sto bare på' },
      home:  { bar: '#9AA4AF', bg: 'transparent', fg: '#C9D1D9', border: '#5B6672', label: 'Startskjerm – teller ikke' }
    };
    var mins = function (t) { var p = t.split(':'); return Number(p[0]) * 60 + Number(p[1]) - 360; };
    var span = 1080;
    var raw = [
      ['14:08', '14:12', 'Startskjerm', 'home', '4 min'],
      ['14:12', '14:18', 'Netflix', 'open', '6 min'],
      ['14:18', '15:33', 'Netflix', 'play', '1 t 15 min'],
      ['15:33', '15:40', 'Netflix', 'pause', '7 min'],
      ['15:40', '16:00', 'YouTube', 'play', '20 min'],
      ['16:00', '17:50', 'Skjermsparer', 'idle', '1 t 50 min'],
      ['17:50', '17:52', 'Startskjerm', 'home', 'pågår']
    ];
    var segs = raw.map(function (r) {
      var c = C[r[3]], a = mins(r[0]), b = mins(r[1]);
      return { style: 'position: absolute; top: 0; bottom: 0; left: ' + (a / span * 100) + '%; width: ' + Math.max((b - a) / span * 100, 0.3) + '%; background: ' + c.bar };
    });
    var rows = raw.map(function (r, i) {
      var c = C[r[3]];
      var last = i === raw.length - 1;
      var focused = i === 2;
      return {
        time: r[0] + ' – ' + (last ? '' : r[1]),
        app: r[2],
        dur: r[4],
        label: c.label,
        rowStyle: 'display: flex; align-items: center; gap: 16px; height: 42px; padding: 0 16px; border-radius: 10px; box-sizing: border-box; ' + (focused ? 'background: #212B35; outline: 2px solid #EEF1F4; outline-offset: -2px' : 'background: transparent'),
        dotStyle: 'width: 12px; height: 12px; border-radius: 6px; flex-shrink: 0; background: ' + c.bar,
        chipStyle: 'font-size: 15px; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: ' + c.bg + '; color: ' + c.fg + '; border: 1px dashed ' + c.border
      };
    });
    var nowLeft = mins('17:52') / span * 100;
    return {
      segs: segs,
      rows: rows,
      nowStyle: 'position: absolute; top: 0; bottom: 0; width: 2px; background: #EEF1F4; left: ' + nowLeft + '%'
    };
  }
}
</script>
</body>
</html>
